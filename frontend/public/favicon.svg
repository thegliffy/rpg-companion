<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- d20 favicon: gold on dark, matches the app's default theme -->
  <rect width="64" height="64" rx="12" fill="#1a1206"/>
  <!-- hexagonal silhouette of a d20 viewed face-on -->
  <polygon points="32,4 56,17 56,47 32,60 8,47 8,17" fill="none" stroke="#d7ab63" stroke-width="4" stroke-linejoin="round"/>
  <!-- facet lines: central triangle from alternating vertices -->
  <polygon points="32,4 56,47 8,47" fill="#d7ab63" fill-opacity="0.15" stroke="#d7ab63" stroke-width="3" stroke-linejoin="round"/>
  <!-- the number 20 on the top face -->
  <text x="32" y="42" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="20" fill="#f0c87f">20</text>
</svg>
